name: MEZAN Attendance APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget findutils

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d build_source

          echo "===== Extracted files ====="
          find build_source -maxdepth 4 -type f -print

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Prefer a directory containing settings.gradle/settings.gradle.kts
          PROJECT_DIR="$(find build_source -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit | xargs -r dirname)"

          # Fallback: directory containing build.gradle/build.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find build_source -type f \( \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' \
            \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be located."
            find build_source -maxdepth 6 -type f -print
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Existing Gradle wrapper found."
            chmod +x ./gradlew
          else
            echo "No Gradle wrapper found."
            echo "Installing Gradle 8.10.2..."

            cd "$RUNNER_TEMP"

            wget -q \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            export PATH="$RUNNER_TEMP/gradle-8.10.2/bin:$PATH"

            cd "$GITHUB_WORKSPACE"

            gradle wrapper --gradle-version 8.10.2

            chmod +x ./gradlew
          fi

          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "===== Searching for APK files ====="

          find . -type f -name "*.apk" -print

          APK_FILE="$(find . -type f -name "*.apk" \
            -not -path "./build_source/*" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated."

            echo "===== All build files ====="
            find . -type f | sort

            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Copy final APK
        shell: bash
        run: |
          set -e

          rm -rf final_apk
          mkdir -p final_apk

          cp "${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_file }}" \
             "final_apk/MEZAN_ATTENDANCE.apk"

          echo "===== FINAL APK ====="
          ls -lh final_apk/MEZAN_ATTENDANCE.apk

          file final_apk/MEZAN_ATTENDANCE.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="final_apk/MEZAN_ATTENDANCE.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK file does not exist."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          # A real Android APK should not be an extremely tiny file.
          if [ "$SIZE" -lt 20000 ]; then
            echo "ERROR: Generated APK is suspiciously small."
            exit 1
          fi

          echo "APK verification passed."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZAN-ATTENDANCE-APK
          path: final_apk/MEZAN_ATTENDANCE.apk
          if-no-files-found: error
          retention-days: 30
