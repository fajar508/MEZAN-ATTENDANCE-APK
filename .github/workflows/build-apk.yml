name: MEZAN Attendance APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

          - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d build_source

          echo "Extracted files:"
          find build_source -maxdepth 4 -type f | sort

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \( \
            -name 'settings.gradle' \
            -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find build_source -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking Gradle files..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo ""
          echo "Android project verified successfully."

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Copy final APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          cp "${{ steps.apk.outputs.apk_file }}" \
            "$GITHUB_WORKSPACE/MEZAN_ATTENDANCE_DEBUG.apk"

          ls -lh "$GITHUB_WORKSPACE/MEZAN_ATTENDANCE_DEBUG.apk"

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/MEZAN_ATTENDANCE_DEBUG.apk"

          echo "Final APK verified:"
          ls -lh "$GITHUB_WORKSPACE/MEZAN_ATTENDANCE_DEBUG.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZAN-Attendance-APK
          path: MEZAN_ATTENDANCE_DEBUG.apk
          if-no-files-found: error
