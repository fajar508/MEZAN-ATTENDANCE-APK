name: MEZAN Attendance APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"

          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP file was found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build_source"

          mkdir -p "$GITHUB_WORKSPACE/build_source"

          unzip -q \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/build_source"

          echo "Android project extracted successfully."

          echo "Searching extracted files..."

          find "$GITHUB_WORKSPACE/build_source" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -200

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=""

          while IFS= read -r file; do
            case "$file" in
              */settings.gradle|*/settings.gradle.kts|*/settings.gradle.dcl)
                SETTINGS_FILE="$file"
                break
                ;;
            esac
          done < <(
            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
                -o -name 'settings.gradle.dcl' \
              \) \
              -print
          )

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file was found."

            echo "Searching for Gradle build files..."

            find "$GITHUB_WORKSPACE/build_source" \
              -type f \
              \( \
                -name 'build.gradle' \
                -o -name 'build.gradle.kts' \
              \) \
              -print \
              | head -100

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.dcl" ]; then

            echo "ERROR: Gradle settings file found but root build file is missing."

            echo "Project directory:"
            echo "$PROJECT_DIR"

            ls -la "$PROJECT_DIR"

            exit 1
          fi

          echo "Android project found successfully."

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

            ./gradlew --version
          else
            echo "No Gradle wrapper found."

            gradle --version
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Starting Android APK build..."

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug

          else

            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug

          fi

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_FILE="$(
            find "${{ steps.locate.outputs.project_dir }}" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: No debug APK was generated."

            echo "Searching for any APK files..."

            find "${{ steps.locate.outputs.project_dir }}" \
              -type f \
              -name '*.apk' \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Copy final APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/final_apk"

          cp \
            "${{ steps.apk.outputs.apk_file }}" \
            "$GITHUB_WORKSPACE/final_apk/MEZAN-ATTENDANCE.apk"

          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/final_apk/MEZAN-ATTENDANCE.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZAN-ATTENDANCE-APK
          path: final_apk/MEZAN-ATTENDANCE.apk
          if-no-files-found: error
