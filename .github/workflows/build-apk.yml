name: MEZAN Attendance APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Find APK Builder ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract APK Builder ZIP
        run: |
          rm -rf build_source
          mkdir -p build_source

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d build_source

          echo "===== Extracted files ====="
          find build_source -maxdepth 5 -type f | sort

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR="$(find build_source -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find build_source -type f -name 'build.gradle' -o -name 'build.gradle.kts' | head -n 1 | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project could not be found."
            echo "Files found:"
            find build_source -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          echo "===== Android project ====="
          ls -la

          echo "===== Checking Gradle files ====="
          find . -maxdepth 3 -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Existing Gradle Wrapper found."
          else
            echo "No Gradle Wrapper found."
            echo "Downloading Gradle 8.10.2..."

            cd "$RUNNER_TEMP"

            wget -q \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip

            export PATH="$RUNNER_TEMP/gradle-8.10.2/bin:$PATH"

            cd "$GITHUB_WORKSPACE/${{ steps.locate.outputs.project_dir }}"

            gradle wrapper --gradle-version 8.10.2

            chmod +x ./gradlew
          fi

          echo "===== Wrapper version ====="
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK_FILE="$(find . -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find . -type f | sort
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          cp "${{ steps.apk.outputs.apk_file }}" \
             "$GITHUB_WORKSPACE/MEZAN_ATTENDANCE_DEBUG.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZAN-ATTENDANCE-APK
          path: MEZAN_ATTENDANCE_DEBUG.apk
          if-no-files-found: error
