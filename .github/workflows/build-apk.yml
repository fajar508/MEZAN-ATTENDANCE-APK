name: MEZAN Attendance APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./MEZAN_ATTENDANCE_FREE_APK_BUILDER_V3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found: $ZIP_FILE"
            exit 1
          fi

          echo "Android project ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_FILE" -d build_source

          echo "Android project extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/gradle-*/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Apply MEZAN MainActivity override
        shell: bash
        run: |
          set -e

          OVERRIDE_FILE="overrides/app/src/main/java/com/mezan/executivetower/attendance/MainActivity.java"

          if [ ! -f "$OVERRIDE_FILE" ]; then
            echo "ERROR: MainActivity override not found."
            exit 1
          fi

          TARGET_DIR="$PROJECT_DIR/app/src/main/java/com/mezan/executivetower/attendance"

          mkdir -p "$TARGET_DIR"

          cp "$OVERRIDE_FILE" "$TARGET_DIR/MainActivity.java"

          echo "MEZAN MainActivity override applied successfully."

      - name: Apply MEZAN App Logo
        shell: bash
        run: |
          set -e

          LOGO_FILE="$GITHUB_WORKSPACE/MEZAN_EXECUTIVE_TOWER_App_Icon_1024.png"
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          MANIFEST_FILE="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: MEZAN logo not found."
            exit 1
          fi

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          mkdir -p "$RES_DIR/drawable-nodpi"

          cp "$LOGO_FILE" "$RES_DIR/drawable-nodpi/mezan_app_icon.png"

          sed -i -E \
            's#android:icon="[^"]+"#android:icon="@drawable/mezan_app_icon"#' \
            "$MANIFEST_FILE"

          sed -i -E \
            's#android:roundIcon="[^"]+"#android:roundIcon="@drawable/mezan_app_icon"#' \
            "$MANIFEST_FILE"

          echo "MEZAN App Logo applied successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_FILE")

          echo "APK size: $APK_SIZE bytes"

          file "$APK_FILE"

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf final_apk
          mkdir -p final_apk

          cp "$APK_FILE" final_apk/MEZAN-ATTENDANCE.apk

          echo "Final APK prepared:"
          ls -lh final_apk/MEZAN-ATTENDANCE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEZAN-ATTENDANCE-APK
          path: final_apk/MEZAN-ATTENDANCE.apk
          if-no-files-found: error
          retention-days: 30
